name: Build DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: brew install libusb pkgconf
      - name: Build libmtp from verified source
        run: ./script/setup_dependencies.sh
      - name: Run tests
        run: ./script/test.sh
      - name: Build and verify DMG
        run: ./script/package_dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: AndroidTransmit-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AndroidTransmit-arm64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
            --notes 'Apple Silicon / macOS 27. Ad-hoc signed; not notarized by Apple.'
